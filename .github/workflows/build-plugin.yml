name: Build File Transformation Plugin

on:
  push:
    branches:
      - fix/startup-crash-di-registration
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source
      - name: Checkout source
        uses: actions/checkout@v3

      # 2️⃣ Setup .NET 8 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      # 3️⃣ Build the plugin
      - name: Build plugin
        run: dotnet build -c Release

      # 4️⃣ Prepare plugin folder with manifest
      - name: Prepare plugin folder
        run: |
          mkdir -p FileTransformation_2.5.5.0
          cp bin/Release/net8.0/Jellyfin.Plugin.FileTransformation.dll FileTransformation_2.5.5.0/
          printf '{\
"Name":"File Transformation",\
"Id":"FileTransformation",\
"Version":"2.5.5.0",\
"Authors":"Enyineer fork",\
"Description":"File Transformation plugin with startup crash DI registration fix for Jellyfin 10.11.6",\
"RequireVersion":"10.11.*",\
"TargetPlatform":"Jellyfin",\
"WebsiteUrl":"https://github.com/enyineer/jellyfin-plugin-file-transformation",\
"SourceUrl":"https://github.com/enyineer/jellyfin-plugin-file-transformation/tree/fix/startup-crash-di-registration"\
}' > FileTransformation_2.5.5.0/manifest.json
          zip -r FileTransformation_2.5.5.0.zip FileTransformation_2.5.5.0/

      # 5️⃣ Upload the ZIP as a workflow artifact
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v3
        with:
          name: FileTransformation_2.5.5.0
          path: FileTransformation_2.5.5.0.zip

      # 6️⃣ Create GitHub Release
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/fix/startup-crash-di-registration'
        uses: ncipollo/release-action@v1
        with:
          tag: "2.5.5.0"
          name: "File Transformation 2.5.5.0 Fixed"
          body: "Auto-built plugin from fix/startup-crash-di-registration branch. Includes startup crash DI registration fix for Jellyfin 10.11.6."
          files: |
            FileTransformation_2.5.5.0.zip
          draft: false
          prerelease: false
